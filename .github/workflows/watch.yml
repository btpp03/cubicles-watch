name: cubicles-watch

on:
  workflow_dispatch:
  schedule:
    # 每 10 分钟（GitHub 原生 schedule 常被延迟，建议再挂 cron-job.org 外腿）
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: cubicles-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 查免费机位
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 watch.py

      - name: 保存状态
        run: |
          git config user.name "cubicles-watch"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "状态无变化，不提交"
          else
            git commit -m "status: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
